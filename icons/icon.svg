<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Container Ship Base / Platform -->
    <rect x="176" y="272" width="160" height="16" rx="8" fill="#ffffff" />

    <!-- Container Stack / Pyramide (6 Container) -->
    <!-- Untere Reihe (3 Container) -->
    <rect x="186" y="200" width="42" height="64" rx="8" fill="#ffffff" />
    <rect x="193" y="212" width="28" height="8" rx="4" fill="#6dac20" />
    <rect x="193" y="236" width="28" height="8" rx="4" fill="#6dac20" />

    <rect x="235" y="200" width="42" height="64" rx="8" fill="#ffffff" />
    <rect x="242" y="212" width="28" height="8" rx="4" fill="#6dac20" />
    <rect x="242" y="236" width="28" height="8" rx="4" fill="#6dac20" />

    <rect x="284" y="200" width="42" height="64" rx="8" fill="#ffffff" />
    <rect x="291" y="212" width="28" height="8" rx="4" fill="#6dac20" />
    <rect x="291" y="236" width="28" height="8" rx="4" fill="#6dac20" />

    <!-- Mittlere Reihe (2 Container) -->
    <rect x="210" y="128" width="42" height="64" rx="8" fill="#ffffff" />
    <rect x="217" y="140" width="28" height="8" rx="4" fill="#6dac20" />
    <rect x="217" y="164" width="28" height="8" rx="4" fill="#6dac20" />

    <rect x="260" y="128" width="42" height="64" rx="8" fill="#ffffff" />
    <rect x="267" y="140" width="28" height="8" rx="4" fill="#6dac20" />
    <rect x="267" y="164" width="28" height="8" rx="4" fill="#6dac20" />

    <!-- Obere Reihe (1 Container) -->
    <rect x="235" y="56" width="42" height="64" rx="8" fill="#ffffff" />
    <rect x="242" y="68" width="28" height="8" rx="4" fill="#6dac20" />
    <rect x="242" y="92" width="28" height="8" rx="4" fill="#6dac20" />

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="1">Docker</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>

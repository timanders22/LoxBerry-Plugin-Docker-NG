[AUTHOR]
# Autorenname, E-Mail und Plugin-Name bilden zusammen den MD5-Schluessel in der
# plugindatabase.json. Nach der ersten Veroeffentlichung NIE mehr aendern -
# LoxBerry erkennt das Plugin sonst nicht wieder und Updates schlagen fehl.
#
# Bewusst NICHT die Angabe des Originalautors: Docker NG ist ein eigenstaendiges
# Plugin mit eigenem Ordner, kein Update von "docker". Beide lassen sich
# nebeneinander installieren, und wer beim Original bleiben will, behaelt es
# unveraendert.
NAME=Docker NG Plugin Authors
EMAIL=dockerng@users.noreply.github.com

[PLUGIN]
VERSION=1.3.0
NAME=dockerng
FOLDER=dockerng
TITLE=Docker NG

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben.
#
# Wichtig: Adressen NIE auf das Originalrepository richten. Dort steht eine
# aeltere Fassung, und LoxBerry vergleicht Fassungen als Zahl - daraus wuerde
# ein stilles Downgrade. Genau das ist beim Original schon einmal passiert:
# dessen release.cfg zeigte auf ein voellig anderes Plugin (xiaomi-miflora).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Docker-NG/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Docker-NG/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Ab LoxBerry 3 ist das MQTT-Gateway Bestandteil des Systems. Mit dieser
# Untergrenze entfaellt jede Fallunterscheidung im Code.
#
# Bis 1.1.0 stand hier zusaetzlich "die Oberflaeche setzt PHP 8 voraus".
# Das war falsch: der Quelltext enthaelt kein einziges Konstrukt, das PHP 8
# braucht - kein str_contains, kein match, kein ?->. Nachgezaehlt am
# 07.08.2026, nachdem ein Mitleser das Plugin auf PHP 7.4 gemeldet hatte.
LB_MINIMUM=3.0.0
# Keine Obergrenze: plugininstall.pl bricht bei Ueberschreitung ab, statt nur
# zu warnen. Eine Obergrenze braucht einen belegten Grund - hier gibt es keinen.
LB_MAXIMUM=false
# Keine Architekturbindung: get.docker.com bedient armhf, arm64 und amd64. Ob
# Docker sich tatsaechlich einrichten laesst, prueft postroot.sh und meldet es
# klar - das ist aussagekraeftiger als eine Liste von Architekturnamen.
ARCHITECTURE=false
# CUSTOM_LOGLEVELS ist bewusst NICHT gesetzt.
#
# Der Schalter blendet in der Plugin-Verwaltung einen Loglevel-Waehler ein.
# Der wirkt aber nur, wenn das Plugin sein Protokoll ueber LoxBerry::Log
# fuehrt und den eingestellten Wert auch auswertet. Dieses Plugin schreibt
# eine schlichte Textdatei (dk_log in dk_lib.php). Bis 1.1.0 stand der
# Schalter trotzdem auf true - der Waehler war da und tat nichts. Ein
# Bedienelement ohne Wirkung ist schlimmer als keines: es laesst den
# Anwender suchen, was er falsch gemacht hat.

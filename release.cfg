[AUTOUPDATE]
# HINWEIS ZUM TAG-VORSATZ: Bis 1.2.2 trugen die Tags dieses Plugins den
# Vorsatz 'ng-' (ng-1.2.2) - als einzige Linie. Ab 1.2.3 gilt die
# Hauskonvention kleines v (v1.2.3). Die alten Tags bleiben unangetastet:
# installierte Anlagen ziehen ihre Archive daraus.
# Diese Datei liegt im Wurzelverzeichnis des GitHub-Repositories und steuert
# das Auto-Update.
#
# ACHTUNG - bei JEDEM Release muessen DREI Stellen dieselbe Fassung nennen,
# sonst laedt LoxBerry das falsche Archiv:
#
#   1. plugin.cfg   -> [PLUGIN] VERSION
#   2. release.cfg  -> VERSION            (diese Datei)
#   3. release.cfg  -> ARCHIVEURL und INFOURL (Tag vX.Y.Z im Pfad)
#
# Dazu muss der Tag auf GitHub wirklich existieren. Zwei Adressen, zwei
# verschiedene Quellen: die plugin.cfg liest DIESE Datei aus dem ZWEIG master,
# das ARCHIVEURL unten zieht aber aus dem TAG. Wer hier etwas aendert, ohne den
# Tag mitzuziehen, liefert an neue Installationen weiter den alten Stand aus.
#
# Die prerelease.cfg fuehrt dieselbe Fassung und dieselben Adressen.
#
# ZUR HERKUNFT DER ALTEN TAG-NAMEN: Dieses Repository ist ein Fork und hat aus
# der Historie des Originals Tags geerbt - darunter ein v1.0.0, das die Fassung
# 1.0.0 des ALTEN Docker-Plugins bezeichnet. Ein zweites v1.0.0 mit anderer
# Bedeutung waere irrefuehrend gewesen, und fremde Tags zu ueberschreiben kam
# nicht in Frage. Die Docker-NG-Reihe trug deshalb BIS 1.2.2 den Praefix ng-
# (ng-1.0.0 ... ng-1.2.2). Diese Tags bleiben unangetastet; installierte
# Anlagen ziehen ihre Archive daraus.
#
# AB 1.2.3 GILT DAS KLEINE v - siehe den Hinweis ganz oben. Der Sonderweg
# endet damit; ein Zusammenstoss mit dem geerbten v1.0.0 ist ausgeschlossen,
# weil die Reihe laengst hoehere Nummern traegt.

VERSION=1.3.4
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Docker-NG/archive/refs/tags/v1.3.4.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Docker-NG/releases/tag/v1.3.4

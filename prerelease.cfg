[AUTOUPDATE]
# HINWEIS ZUM TAG-VORSATZ: Bis 1.2.2 trugen die Tags dieses Plugins den
# Vorsatz 'ng-' (ng-1.2.2) - als einzige Linie. Ab 1.2.3 gilt die
# Hauskonvention kleines v (v1.2.3). Die alten Tags bleiben unangetastet:
# installierte Anlagen ziehen ihre Archive daraus.
# Solange keine eigene Vorabfassung gepflegt wird, stehen hier dieselbe Fassung
# und dieselben Adressen wie in der release.cfg.
#
# Das gilt auch dann, wenn die Adresse in der plugin.cfg nie abgerufen wird -
# sie soll stimmen, falls sie jemals eingetragen wird. Eine prerelease.cfg
# OHNE VERSION-Zeile waere der schlechteste Fall: wird sie doch einmal
# abgerufen, ist das Verhalten undefiniert.
#
# ZUM TAG-NAMEN: Dieses Repository ist ein Fork und hat aus der Historie des
# Originals bereits Tags geerbt - darunter ein v1.0.0, das die Fassung 1.0.0
# des ALTEN Docker-Plugins bezeichnet. Ein zweites v1.0.0 mit anderer Bedeutung
# waere irrefuehrend, und fremde Tags zu ueberschreiben kommt nicht in Frage.
# Die Docker-NG-Reihe benutzt deshalb den Praefix ng-: ng-1.0.0, ng-1.2.0 ...

VERSION=1.2.3
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Docker-NG/archive/refs/tags/v1.2.3.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Docker-NG/releases/tag/v1.2.3

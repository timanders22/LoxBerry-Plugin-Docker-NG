ROTATION = "Log-Rotation von Docker"
ROTATION_JA = "Die Container-Protokolle sind auf <span class='sm-mono'>%s</span> je Datei und <span class='sm-mono'>%s</span> Dateien begrenzt."
ROTATION_NEIN = "<b>Die Container-Protokolle wachsen unbegrenzt.</b> Der Treiber <span class='sm-mono'>json-file</span> hat als Vorgabe <span class='sm-mono'>max-size: -1</span>. Ein einziger gesprächiger Container in einer Reconnect-Schleife schreibt damit die Speicherkarte voll — und ein volles Dateisystem macht den LoxBerry unbootbar. Abhilfe auf der Kommandozeile: in <span class='sm-mono'>/etc/docker/daemon.json</span> unter <span class='sm-mono'>log-opts</span> die Werte <span class='sm-mono'>max-size</span> und <span class='sm-mono'>max-file</span> setzen, dann <span class='sm-mono'>sudo systemctl restart docker</span>. <b>Achtung:</b> das wirkt nur auf künftig erzeugte Container; bestehende behalten ihre alten Vorgaben."
ROTATION_UNKLAR = "Ob die Container-Protokolle begrenzt sind, ließ sich nicht feststellen — <span class='sm-mono'>/etc/docker/daemon.json</span> ist für den Webserver nicht lesbar. Das ist kein Fehler, nur eine fehlende Auskunft."
SETUPTOKEN = "Setup-Token"

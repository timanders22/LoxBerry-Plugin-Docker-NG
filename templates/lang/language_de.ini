WAS_IST_DAS = "<b>Docker und Portainer auf dem LoxBerry, mit Zustandsmeldung an Loxone.</b> Das Plugin richtet Docker ein und dazu Portainer, die Oberfläche, mit der sich Container anklicken statt auf der Kommandozeile eintippen lassen. Ein Minutentakt fragt Docker nach dem Zustand aller Container: läuft, gestoppt, Störung, Healthcheck, Neustartschleife, dazu der freie Plattenplatz. Der Zustand geht über einen rein lesenden, tokengeschützten HTTP-Endpunkt und auf Wunsch über MQTT an den Miniserver; eine Störung meldet das Plugin außerdem im Benachrichtigungszentrum des LoxBerry, auf Wunsch auch als Ansage."

[LOX]
TITEL = "Containerzustand nach Loxone melden"
EINLEITUNG = "Damit lässt sich in Loxone anzeigen oder melden, wenn ein Container nicht mehr läuft — etwa das Gateway, das die Auto- oder Wetterdaten liefert. Das fällt sonst erst auf, wenn die Werte tagelang alt sind. Gemeldet wird auch, wenn ein Container zwar läuft, aber seinen eigenen Healthcheck nicht besteht, wenn er dauernd neu startet, vom System wegen Speichermangel beendet wurde oder gar nicht mehr da ist. <b>Seit 1.3.19 kommen die Werte über das MQTT-Gateway in Virtuelle Eingänge</b> (Schritt 1); ein freigegebener Container lässt sich aus Loxone neu starten (Schritt 2). Der HTTP-Endpunkt ist der alte Weg für bestehende Anlagen (unten, zugeklappt)."
S1 = "Schritt 1: Virtuellen HTTP-Eingang anlegen"
S1_TEXT = "In Loxone Config einen virtuellen HTTP-Eingang mit dieser Adresse anlegen:"
S1_HINWEIS = "Ein Abfragetakt von 60 Sekunden genügt. Die Antwort ist eine einzelne Zeile:"
S2 = "Schritt 2: Befehlserkennungen"
T_TITEL = "Bezeichnung"
T_ERKENNUNG = "Befehlserkennung"
T_BEDEUTUNG = "Bedeutung"
F_OK = "1 = Docker antwortet"
F_GESAMT = "eingerichtete Container"
F_LAEUFT = "davon aktiv"
F_GESTOPPT = "alle nicht laufenden – nicht melden"
F_CONTAINER = "1 = Container %s läuft"
S2_HINWEIS = "Je erkanntem Container steht zusätzlich eine eigene Stelle in derselben Zeile. Damit lässt sich ein einzelner Container überwachen, ohne ein zweites Mal abzufragen."
S3 = "Schritt 3: Importdatei erzeugen"
S3_TEXT = "Statt jeden Eingang von Hand anzulegen, erzeugt der Knopf eine fertige Importdatei für Loxone Config — mit Titel, Kommentar und Grenzen an Ort und Stelle."
B_XML = "Importdatei für Loxone Config erzeugen"
S3_WARNUNG = "<b>Loxone Config legt beim Import neu an und überschreibt nichts.</b> Zweimal importiert heißt doppelte Objekte. Die Adresse im Kopf der Datei ist ein Vorschlag — bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
S4 = "Schritt 3: Komplette Baustein-Liste zum Nachbauen"
S4_TEXT = "Die Seite „Docker NG“ aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein (Baustein-Suche in Loxone Config: Taste <b>F5</b>). Sie meldet ausgefallene, fehlende, kranke und dauernd neu startende Container, knappen Speicher, einen einzeln überwachten Container, einen nicht antwortenden Docker und einen schweigenden LoxBerry, zeigt alles in drei Status-Bausteinen und startet einen Container per Taste neu. Die Eingänge sind Virtuelle Eingänge mit dem Namen aus Schritt 1 (Spalte Name)."
B_TYP = "Baustein (Typ)"
B_NAME = "Name (Vorschlag)"
B_PARAM = "Parameter"
B_EIN = "Eingänge verbinden mit"
S4_ZU3 = "<b>Zu #9, #24, #28 und #33:</b> Jede Meldung läuft über eine Einschaltverzögerung von 300 s, deutlich über dem Minutentakt des Plugins. Ein kurzer Ausreißer soll keine Meldung auslösen."
S4_ZU4 = "<b>Zu #5 und #8:</b> Niemals mehrere Quellen direkt an einen Benachrichtigungs-Baustein hängen – er bekommt genau eine Leitung, ein ODER höchstens zwei Eingänge. Das ODER bündelt nur: Der Baustein sendet nur beim Wechsel von Aus auf Ein, und eine dauerhaft anstehende Störung verschluckt trotzdem jede weitere Meldung an derselben Benachrichtigung. Deshalb haben „krank“, „Speicher knapp“ und der einzeln überwachte Container eigene Meldungen."
S5 = "Schritt 4: Ausfallerkennung"
S5_TEXT = "Steht der LoxBerry, das MQTT-Gateway oder der Minutentakt, behalten die Virtuellen Eingänge ihren <b>letzten</b> Wert — in der App sähe alles normal aus. Dagegen hilft nur ein Wert, der sich ständig ändert: <span class='sm-mono'>status/zaehler</span> zählt bei jedem Minutentakt eins weiter, auch wenn Docker nicht antwortet. Die Analogwertvalidierung darauf (#6, #7) meldet, wenn fünf Minuten lang nichts Neues kommt. Antwortet nur Docker nicht, meldet das <span class='sm-mono'>status/ok</span> = 0 (#20 über #38 und #43); die Zähl- und Containerwerte stehen dann auf -1 (keine Aussage)."
S6 = "Schritt 5: Gegenprobe"
S6_TEXT = "Im Reiter <b>MQTT</b> steht unter <i>Themenliste</i>, was gerade gesendet wird; im Reiter <b>Test</b> zeigt die Zeile zum MQTT-Weg den letzten Versand. In Loxone Config im Monitor der Virtuellen Eingänge nachsehen, ob die Werte ankommen – der Herzschlag steigt jede Minute."
XML_KOMMENTAR = "Docker NG - Containerzustand"
F_AUSFALL = "Meldung, wenn größer als 0"
F_PAUSIERT = "angehaltene Container"
F_PORTAINER = "1 = eigener Portainer läuft"
S2_AUSFALL = "<b>Für die Überwachung ist <span class='sm-mono'>AUSFALL</span> der richtige Wert, nicht <span class='sm-mono'>GESTOPPT</span>.</b> Gestoppt zählt auch Container mit, die planmäßig zu Ende gelaufen sind — auf einem gewachsenen LoxBerry ist der Wert nie 0, und eine Sammelstörung, die dauerhaft ansteht, verschluckt alle übrigen Meldungen. Gestoppt bleibt erhalten, damit bestehende Programme weiter tragen."
F_UNGESUND = "Container mit Healthcheck-Fehler"
F_FEHLT = "überwachte Container, die es nicht gibt"
F_SCHLEIFE = "Neustartschleifen, -1 = Takt steht"
F_ZAEHLER = "Herzschlag, -1 = Minutentakt steht"
F_PLATZFREI = "freier Platz in MB, -1 unbekannt"
F_TAKTALTER = "Alter des Minutentakts, -1 = nie"
F_CONTAINER_KURZ = "1 läuft, 0 steht, -1 fehlt"
F_GESUND_KURZ = "-1 fehlt,0 ohne,1 startet,2 gut,3 krank"
S4_ZU7 = "<b>Zu #7:</b> Die Analogwertvalidierung liegt am Lebenszeichen status/zaehler (#6). Steht der LoxBerry, das MQTT-Gateway oder der Minutentakt, oder ist MQTT im Plugin aus, kommt kein neuer Wert, und #7 meldet am Ausgang error nach Tmc (300 s). Antwortet nur Docker nicht, läuft der Zähler weiter – das meldet #38. Loxone Config beschriftet die Anschlüsse V, En, Tmc, Min, Max und am Ausgang E (in der Projektdatei inval, mintime, minval, maxval, error). Den Zähler an V legen, nicht an En; an En eine Konstante 1 – unbeschaltet steht En auf EIN (Haken gesetzt); wird En beschaltet, den Haken entfernen. Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
S4_EINZELN = "<b>Zu #30 bis #34, #37, #39 und #40:</b> Ein einzeln überwachter Container bekommt eine eigene Meldung – nicht zwischen #8 und #9 einschleifen. Einen weiteren Container genauso melden: die Zeilen mit dessen Namen aus der Namenstabelle (Schritt 1: <span class='sm-mono'>…_container_&lt;Name&gt;_laeuft</span>, <span class='sm-mono'>_gesund</span>, <span class='sm-mono'>_oom</span>) wiederholen; unter Gateway V2 die drei Datenpunkte anhaken. Ein planmäßig beendeter Container (etwa eine nächtliche Sicherung) meldet hier jede Nacht „steht“: solche Container nicht einzeln melden."
S4_ZU11 = "<b>Zu #11:</b> Die Analogwertvalidierung bekommt an En die Konstante 1."

[LOX]
TITEL = "Containerzustand nach Loxone melden"
EINLEITUNG = "Damit lässt sich in Loxone anzeigen oder melden, wenn ein Container nicht mehr läuft — etwa das Gateway, das die Auto- oder Wetterdaten liefert. Das fällt sonst erst auf, wenn die Werte tagelang alt sind. Gemeldet wird auch, wenn ein Container zwar läuft, aber seinen eigenen Healthcheck nicht besteht, wenn er dauernd neu startet, oder wenn er gar nicht mehr da ist."
S1 = "Schritt 1: Virtuellen HTTP-Eingang anlegen"
S1_TEXT = "In Loxone Config einen virtuellen HTTP-Eingang mit dieser Adresse anlegen:"
S1_HINWEIS = "Ein Abfragetakt von 60 Sekunden genügt. Die Antwort ist eine einzelne Zeile:"
S2 = "Schritt 2: Befehlserkennungen"
T_TITEL = "Bezeichnung"
T_ERKENNUNG = "Befehlserkennung"
T_BEDEUTUNG = "Bedeutung"
F_OK = "1 = Docker antwortet"
F_GESAMT = "eingerichtete Container"
F_LAEUFT = "davon aktiv"
F_GESTOPPT = "alle nicht laufenden – nicht melden"
F_CONTAINER = "1 = Container %s läuft"
S2_HINWEIS = "Je erkanntem Container steht zusätzlich eine eigene Stelle in derselben Zeile. Damit lässt sich ein einzelner Container überwachen, ohne ein zweites Mal abzufragen."
S3 = "Schritt 3: Importdatei erzeugen"
S3_TEXT = "Statt jeden Eingang von Hand anzulegen, erzeugt der Knopf eine fertige Importdatei für Loxone Config — mit Titel, Kommentar und Grenzen an Ort und Stelle."
B_XML = "Importdatei für Loxone Config erzeugen"
S3_WARNUNG = "<b>Loxone Config legt beim Import neu an und überschreibt nichts.</b> Zweimal importiert heißt doppelte Objekte. Die Adresse im Kopf der Datei ist ein Vorschlag — bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
S4 = "Schritt 4: Komplette Baustein-Liste zum Nachbauen"
S4_TEXT = "Wer diese Tabelle von oben nach unten abarbeitet, hat die Überwachung nachgebaut. Loxone Config führt alle Bausteine in der Baustein-Suche (Taste F5)."
B_TYP = "Baustein (Typ)"
B_NAME = "Name (Vorschlag)"
B_PARAM = "Parameter"
B_EIN = "Eingänge verbinden mit"
BS_VI = "Virtueller HTTP-Eingang"
BS_VI_P = "aus Schritt 1 bzw. 3"
BS_SWS = "Schwellwertschalter"
BS_SWS_P = "Ein ab 1, Aus unter 1"
BS_EIN = "Einschaltverzögerung"
BS_EIN_P = "300 s"
BS_ODER = "ODER"
BS_BENACH = "Benachrichtigung"
BS_BENACH_P = "Betreff frei wählbar"
S4_ZU3 = "<b>Zu #9:</b> Die Verzögerung liegt deutlich über dem Abfragetakt von 60 Sekunden. Ein einzelner verpasster Durchlauf soll keine Meldung auslösen."
S4_ZU4 = "<b>Zu #5 und #8:</b> Niemals mehrere Quellen direkt an den Benachrichtigungs-Baustein hängen. Er sendet nur beim Wechsel von Aus auf Ein — eine dauerhaft aktive Quelle verschluckt sonst alle übrigen. Erst über ODER zusammenführen, je ODER höchstens zwei Eingänge."
S5 = "Schritt 5: Ausfallerkennung"
S5_TEXT = "Antwortet der LoxBerry gar nicht, behält der virtuelle Eingang seinen <b>letzten</b> Wert — in der App sieht dann alles normal aus. Dasselbe gilt, wenn Docker nicht antwortet: dann liefert der Endpunkt HTTP 503 und keine Werte, und Loxone behält ebenfalls alle bisherigen, auch <span class='sm-mono'>DOCKERNG_OK=1</span>. Dagegen hilft nur ein Wert, der sich ständig ändert: <span class='sm-mono'>DOCKERNG_ZAEHLER</span> zählt bei jedem Durchlauf des Minutentakts eine Stelle weiter und steht auf -1, sobald der Takt älter als drei Minuten ist. Die Änderungsüberwachung darauf (#6 und #7) meldet beides, auch wenn alle übrigen Werte gut aussehen."
S6 = "Schritt 6: Gegenprobe"
S6_TEXT = "Im Reiter <b>Test</b> unter <i>Ansehen</i> den Knopf <i>Loxone-Zeile abrufen</i> drücken. Erscheint dieselbe Zeile wie oben, stimmt die Adresse samt Merkwort. Danach in Loxone Config im Monitor des virtuellen Eingangs nachsehen, ob die Werte ankommen."

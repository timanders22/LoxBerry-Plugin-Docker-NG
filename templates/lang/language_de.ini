SETUPTOKEN_TEXT = "Ab Portainer 2.43 beziehungsweise 2.39.4 verlangt die Ersteinrichtung einen Token, der <b>nur im Containerprotokoll</b> steht und nach fünf Minuten verfällt. Die beiden Knöpfe nehmen das Nachsehen auf der Kommandozeile ab. Ist das Fenster abgelaufen, holt der orange Knopf mit dem Neustart gleich einen frischen Token."

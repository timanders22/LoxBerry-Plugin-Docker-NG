Z39_PARAM = "IF(I2<1;1;I1) – antwortet Docker nicht (I2 = 0), gilt „läuft“; über Docker selbst meldet die Sammelstörung (#38)"
Z40_PARAM = "1 = %1$s wurde zuletzt vom System wegen Speichermangel beendet (OOM), 0 = nein, -1 = fehlt oder keine Aussage; zurückbehalten; Fassung 2: Haken"

S4_ZU3 = "<b>Zu #3:</b> Die Verzögerung liegt deutlich über dem Abfragetakt von 60 Sekunden. Ein einzelner verpasster Durchlauf soll keine Meldung auslösen."
S4_ZU4 = "<b>Zu #4:</b> Niemals mehrere Quellen direkt an den Benachrichtigungs-Baustein hängen. Er sendet nur beim Wechsel von Aus auf Ein — eine dauerhaft aktive Quelle verschluckt sonst alle übrigen. Erst über ODER zusammenführen."
S5 = "Schritt 5: Ausfallerkennung"
S5_TEXT = "Antwortet der LoxBerry gar nicht, behält der virtuelle Eingang seinen <b>letzten</b> Wert — in der App sieht dann alles normal aus. Dagegen hilft nur ein Wert, der sich ständig ändert: <span class='sm-mono'>DOCKERNG_ZAEHLER</span> zählt bei jedem Durchlauf des Minutentakts eine Stelle weiter. Eine Änderungsüberwachung darauf (#8 und #9) meldet den Ausfall auch dann, wenn alle übrigen Werte gut aussehen. Zusätzlich den Baustein <i>NICHT</i> hinter <span class='sm-mono'>DOCKERNG_OK</span> hängen (#6 und #7)."
S6 = "Schritt 6: Gegenprobe"
S6_TEXT = "Im Reiter <b>Test</b> den grünen Knopf drücken. Erscheint dieselbe Zeile wie oben, stimmt die Adresse samt Merkwort. Danach in Loxone Config im Monitor des virtuellen Eingangs nachsehen, ob die Werte ankommen."

EINLEITUNG = "Das MQTT-Gateway ist seit LoxBerry 3 Bestandteil des Systems — es muss nicht nachinstalliert werden. Seit 1.3.19 ist MQTT der Weg nach Loxone: das Gateway liefert die Werte in Virtuelle Eingänge (Namen im Reiter Einbindung), und über denselben Weg kommt der Befehl „Container neu starten“ zurück. Der HTTP-Endpunkt bleibt für bestehende Anlagen."

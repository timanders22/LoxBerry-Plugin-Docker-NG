B_WACHE = "Wachliste speichern"
CONTAINER = "Container auf diesem LoxBerry"
CONTAINER_HINWEIS = "Starten, Anhalten und Einrichten läuft über Portainer. Diese Liste ist nur eine Übersicht — dieses Plugin schaltet nichts."
H_FEHLT = "Diese Container stehen auf der Wachliste, es gibt sie aber nicht. Nach Loxone geht dafür <span class='sm-mono'>-1</span>. Entweder wurden sie umbenannt oder entfernt — dann den Haken hier wegnehmen — oder sie fehlen wirklich, und genau das soll auffallen."
H_KOLLISION = "In der Befehlserkennung sind nur Buchstaben, Ziffern und Unterstrich erlaubt; Punkt und Bindestrich werden zu Unterstrich. Dadurch tragen die oben genannten Container denselben Schlüssel — Loxone nimmt den ersten, der zweite bleibt unbeobachtet. Abhilfe: einen der beiden Container umbenennen."
H_MELDEN = "Erzeugt den roten Punkt am Plugin-Symbol auf der LoxBerry-Startseite. Gemeldet wird nur bei <b>Wechsel</b> des Befundes, nicht bei jedem Durchlauf — eine Meldung je Minute wäre keine Meldung, sondern Rauschen. Ab Werk aus."
H_NAME = "Nur nötig, wenn der Container anders heißt als <span class='sm-mono'>portainer</span>. Erlaubt sind Buchstaben, Ziffern, Punkt, Bindestrich und Unterstrich."
H_PLATZ = "0 schaltet die Meldung ab. Gemessen wird der freie Platz auf der Partition, auf der <span class='sm-mono'>/var/lib/docker</span> liegt. Das ist der einzige Punkt, der einen LoxBerry unbootbar machen kann."
H_PORT = "Vorgabe ist 9000. <b>Dieses Feld richtet den Container nicht neu ein</b> — es ist die Rückfallebene für die Anzeige, falls sich der wirkliche Port nicht am Container ablesen lässt. Wer Portainer auf einem anderen Port betreiben will, legt den Container mit der gewünschten Zuordnung neu an, etwa <span class='sm-mono'>-p 9001:9000</span>. Ab Portainer CE 2.19 lauscht ohne <span class='sm-mono'>--http-enabled</span> nichts auf Port 9000 — der Container läuft dann zwar, der Browser meldet aber nur <i>Verbindung abgelehnt</i>. Das Installationsskript dieses Plugins setzt das Kennzeichen."
H_SCHLEIFE = "Docker zählt Neustarts über die gesamte Lebensdauer eines Containers — 47 in zwei Jahren sind gesund, fünf in zehn Minuten nicht. Gezählt wird deshalb der Zuwachs in einem gleitenden Fenster von einer Stunde. <b>Nicht nachgemessen:</b> ob ein Neustart von Hand — etwa über den Knopf im Reiter Test — diesen Zähler mit erhöht. Deshalb ist die Vorgabe 3 und nicht 1."
H_SICHERUNG = "Einstellungen sichern und zurückspielen"
H_TOKENNEU = "<b>Vorsicht:</b> Das Merkwort steckt in den Adressen im Miniserver. Nach dem Neuwürfeln müssen alle virtuellen Eingänge in Loxone Config angepasst werden."
H_UPDATES = "<b>Das geht ins Netz.</b> Verglichen werden Prüfsummen über einen HEAD-Aufruf an die Registry; HEAD zählt nicht gegen das Abrufkontingent von Docker Hub. Wo keine Antwort kommt — eigene Registry, lokal gebautes Abbild —, heißt das <i>unbekannt</i> und nicht <i>veraltet</i>. Es wird nichts geladen und nichts aktualisiert. Ab Werk aus."
H_WACHE = "Ohne Haken gilt die Auswahl aus der Tabelle darüber. Der Unterschied zählt: bei „alle“ wandert jeder neu angelegte Container automatisch nach Loxone — dafür muss die Importdatei nach jedem neuen Container erneut erzeugt werden. Mit fester Auswahl bleibt die Importdatei stabil, und ein Container, den es nicht mehr gibt, meldet sich als <span class='sm-mono'>-1</span> statt einfach zu verschwinden."
KEINE_CONTAINER = "Es ist noch kein Container eingerichtet. Legen Sie in Portainer über <i>Add container</i> den ersten an."
KEIN_IFRAME = "<b>Portainer lässt sich nicht in diese Seite einbetten.</b> Die Oberfläche schickt <span class='sm-mono'>X-Frame-Options</span> mit und verbietet damit die Anzeige in einem Rahmen — ein Schutz davor, dass eine fremde Seite Klicks auf Portainer unterschiebt. Deshalb öffnet der Knopf oben ein eigenes Fenster."

S4_ZU7 = "<b>Zu #7:</b> Antwortet Docker nicht (auch bei <i>permission denied</i>), liefert der Endpunkt HTTP 503 ohne Werte; der Zähler steht dann still, und genau das meldet #7 nach fünf Minuten – ebenso, wenn der LoxBerry gar nicht antwortet oder der Minutentakt stehen bleibt (dann -1)."
S4_EINZELN = "Einen einzelnen Container eigens melden: <span class='sm-mono'>DOCKERNG_C_&lt;Name&gt;</span> als virtuellen Eingang, dahinter einen Schwellwertschalter <i>Ein ab 1, Aus unter 1</i> und einen Baustein NICHT (meldet bei 0 = steht und -1 = fehlt), und dessen Ausgang über ein weiteres ODER mit zwei Eingängen zwischen #8 und #9 einschleifen."


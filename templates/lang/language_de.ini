; Docker NG - Sprachdatei Deutsch
;
; Jeder Wert steht in doppelten Anfuehrungszeichen: bei parse_ini_file beginnt
; mit einem Semikolon ein Kommentar, und ein unquotierter Wert wuerde dort
; abgeschnitten. Das traefe ausgerechnet jede HTML-Entitaet - ü, —
; und → enden alle auf ein Semikolon.
;
; Innerhalb eines Wertes darf kein doppeltes Anfuehrungszeichen stehen.
; HTML-Attribute deshalb einfach quoten: <span class='sm-mono'>.

[ALLGEMEIN]
TITEL = "Docker NG"
EINLEITUNG = "Docker lässt zusätzliche Programme in abgeschlossenen Containern auf dem LoxBerry laufen — jedes mit allem, was es braucht, ohne dem Rest des Systems in die Quere zu kommen. <b>Portainer</b> ist die Oberfläche dazu: damit lassen sich Container anklicken statt auf der Kommandozeile eintippen."

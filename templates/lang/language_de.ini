S1_ALT = "Im MQTT-Gateway unter <i>Subscriptions</i> muss <span class='sm-mono'>%s/#</span> eingetragen sein. <b>Der fehlende Eintrag ist der häufigste Grund, warum am Miniserver nichts ankommt</b> — das Gateway empfängt sonst schlicht nichts, und es gibt keine Fehlermeldung, die darauf hinweist."

K_GESAMT = "Container gesamt"
K_GESTOPPT = "gestoppt"
K_HINWEIS = "<b>Gestoppt</b> zählt jeden nicht laufenden Container, auch den planmäßig beendeten Sicherungscontainer. <b>Störung</b> lässt genau die aus: sauber beendet (<span class='sm-mono'>Exited (0)</span>) und noch nie gestartet (<span class='sm-mono'>Created</span>) sind keine Störung. Nach Loxone gehört deshalb Störung, nicht Gestoppt."

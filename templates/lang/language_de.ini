ABSCHNITT_H = "Container, Speicher und Ausfall"
SCHRITT1 = "Im Plugin Reiter „%s“ in der Containertabelle die Container anhaken, die überwacht werden sollen, und „%s“ drücken (ohne Haken: alle Container). Reiter „%s“: „%s“ anhaken (ab Werk an) – der Reiter Test zeigt dann den letzten MQTT-Versand."
SCHRITT2 = "MQTT-Gateway: unter Fassung 1 steht das Abo %s/# schon in der Abodatei des Plugins; unter Fassung 2 in den Subscriptions die Datenpunkte aus dem Reiter MQTT (V2-Hakenliste) anhaken, bei status/ok zusätzlich „Noncached“. Beim Systemstart des Miniservers „reconnect“ an das Gateway senden (Seite „LoxBerry MQTT-Gateway“ im Musterprojekt)."
SCHRITT3 = "Seite „Docker NG“ anlegen. Je Zeile „Virtueller Eingang“ einen Virtuellen Eingang anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang): Titel = Name aus der Liste (oben in Schritt 1 mit Kopierknopf), „Als Digitaleingang verwenden“ NICHT anhaken, bei %s und %s „Statistik“ einschalten; dazu die Konstante 1. Der LoxBerry-Benutzer braucht in Loxone Rechte auf jeden dieser Eingänge."
SCHRITT4 = "Vier Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Docker-Störung“, „Docker Container krank“, „Docker Speicher knapp“, „%s“, Texte wie in der Liste, und auf die Seite ziehen. Jede bekommt genau eine Leitung. Für #42 am vorhandenen Ausgang „LoxBerry MQTT-Gateway“ (Adresse /dev/udp/<LoxBerry>/<UDP-Port>) einen Befehl anlegen, Befehl bei EIN wie in der Liste, und mein_container durch den eigenen Containernamen ersetzen."
SCHRITT5 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. Status-Eingänge ab V3 bzw. V5 erscheinen erst nach Klick auf das „+“ am Baustein: „Docker Container“ viermal (V5–V8), „Docker LoxBerry“ einmal (V5), „Container …“ zweimal (V3–V4). Ein ODER hat genau zwei Eingänge – deshalb bündelt #43 die Ausfallerkennung #7 und #38 für #8. Die Zeilen der Status-Bausteine stehen in der Spalte „%s“ und werden von Hand eingetragen – in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt."
SCHRITT6 = "Speichern und in den Miniserver übertragen. Probe: „Docker LoxBerry“ zeigt „in Ordnung – … MB frei, Herzschlag …“, der Herzschlag steigt jede Minute um eins; „Docker Container“ zeigt dieselbe Zahl laufender Container wie die Statusübersicht über den Reitern des Plugins."
H_ZU26 = "<b>Zu #26 und #27:</b> Die Formel macht aus „unbekannt“ (-1, noch nicht gemessen) einen großen Wert, damit „Speicher knapp“ nicht anspringt. Gemessen wird der Platz nur alle 15 Minuten. 512 MB ist die Warnschwelle des Plugins (Reiter Einstellungen); wer sie dort ändert, ändert #27 und die Zeile im Status #36 mit."
H_OK = "<b>Zu #20:</b> status/ok kommt jede Minute mit dem Lebenszeichen und ist fast immer 1. Unter Gateway V2 „Noncached“ anhaken – sonst bliebe der Eingang nach einem Neustart des Miniservers auf 0, und #38 meldete fälschlich „Docker antwortet nicht“. Die Einschaltverzögerung #9 (300 s) überbrückt den Start des Miniservers."
H_DOPPELT = "Wer im Plugin „Störungen ins Benachrichtigungszentrum von LoxBerry melden“ oder die Sprachausgabe einschaltet, bekommt dieselben Befunde zusätzlich am LoxBerry bzw. als Ansage – eins davon abwählen, wer nur die Loxone-App will."
H_GRENZEN = "Nicht auf der Seite: <span class='sm-mono'>status/ts</span> (Unix-Sekunden – Loxone rechnet in Ortszeit), <span class='sm-mono'>platte/images_mb</span>, <span class='sm-mono'>platte/freigebbar_mb</span> und der Zustand je Container als Text (<span class='sm-mono'>container/&lt;Name&gt;/stand</span>, wer ihn zeigen will: Virtueller Texteingang). Die Quittung des Neustarts (<span class='sm-mono'>befehl/neustart/quittung</span>) ist für das Protokoll da, nicht für Loxone."
BT_VIM = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Docker NG)"
BT_NICHT = "NICHT"
BT_TASTE = "Virtueller Eingang (Taste)"
BT_VQ = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT)"

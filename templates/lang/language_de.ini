N_FEHLWERT_ERKL = "-1 heißt „keine Aussage“: Docker antwortet nicht, der Container fehlt oder der Platz ist noch nicht gemessen. Verschwindet ein Container (nicht auf der Wachliste), räumt das Plugin seine zurückbehaltenen Themen im Broker ab und sendet danach einmal -1 – der Virtuelle Eingang zeigt dann -1, nicht 0."

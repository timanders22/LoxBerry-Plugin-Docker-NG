Z41_PARAM = "in der App drücken, wenn ein hängender Container neu starten soll"
Z42_NAME = "Docker NG: Container neu starten"
Z43_NAME = "Docker schweigt oder antwortet nicht"
Z43_PARAM = "— (kein Lebenszeichen oder Docker antwortet nicht)"
Z42_PARAM = "Befehl bei EIN: publish %2$s/befehl/neustart mein_container (nie retain); „mein_container“ durch den Namen des eigenen Containers ersetzen; eingreifend – wirkt nur mit den Haken „Befehle über MQTT annehmen“ und „Container-Neustart aus Loxone erlauben“ (Reiter MQTT) und wenn der Container im Plugin auf der Wachliste steht und in der Spalte „Neustart aus Loxone“ angehakt ist; nie der eigene Portainer, nie ein MQTT-Broker; höchstens alle 10 Minuten je Container; die Antwort steht unter %2$s/befehl/neustart/quittung"
H_ZU38 = "<b>Zu #38 und #39:</b> #38 macht aus status/ok = 0 („Docker antwortet nicht“) eine Störung; das ODER #43 bündelt sie mit dem Ausgang error von #7 für die Sammelstörung #8 (ein ODER hat genau zwei Eingänge). Die Formel #39 verhindert, dass #32 bei -1 („keine Aussage“, weil Docker schweigt) „portainer steht“ meldet – das meldet dann schon #38. Fehlt der Container wirklich (-1 bei antwortendem Docker), meldet #32 weiter."
H_ZU42 = "<b>Zu #41 und #42:</b> Der Neustart geht nur per Taste in der App – bewusst kein selbsttätiger Neustart bei „steht länger“: eine solche Logik kann sich mit einem kaputten Container oder einem Broker-Container aufschaukeln. „mein_container“ ist ein Platzhalter; ab Werk lehnt das Plugin ihn ab („nicht freigegeben“). Der eigene Portainer ist aus Loxone nie neu startbar, ein MQTT-Broker auch nicht."
F_OOM_KURZ = "1 OOM, 0 nein, -1 fehlt"
MQTT_AUS = "<b>MQTT ist im Plugin aus</b> (Reiter MQTT) – die Namen unten bekommen dann keine Werte. Neue Anlagen senden ab 1.3.19 ab Werk."
N_TITEL = "Schritt 1 – Namen der Virtuellen Eingänge (MQTT-Gateway)"
N_TEXT = "Das Plugin sendet jede Minute über das MQTT-Gateway (Themengruppe <span class='sm-mono'>%s/#</span>, Reiter MQTT). In Loxone Config je Wert einen <b>Virtuellen Eingang</b> anlegen, Titel = Name aus der ersten Spalte (Knopf „kopieren“). Das Gateway bildet den Namen aus dem Thema: Schrägstrich, Prozentzeichen und Leerzeichen werden zu Unterstrich, Punkt und Bindestrich bleiben. Die Containerzeilen richten sich nach der Wachliste (leer: alle Container)."

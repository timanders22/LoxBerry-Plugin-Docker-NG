; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Docker NG"
K02 = "Docker lässt zusätzliche Programme in abgeschlossenen Containern auf dem LoxBerry laufen. <b>Portainer</b> ist die Oberfläche dazu."
K03 = "Verhältnis zum Plugin „Docker“"
K04 = "Docker NG ist ein <b>eigenständiges Plugin</b>, kein Update des älteren Docker-Plugins von M. Miklis. Es benutzt einen eigenen Ordner (<span class='sm-mono'>dockerng</span>) und eine eigene Kennung — beide lassen sich nebeneinander installieren, und wer beim Original bleiben will, behält es unverändert. Der Originalautor hat mitgeteilt, dass er weder Docker noch einen LoxBerry weiter betreibt."
K05 = "Die drei Fallstricke bei Portainer"
K06 = "<b>Port 9000 blieb stumm.</b> Ab Portainer CE 2.19 lauscht ohne <span class='sm-mono'>--http-enabled</span> nichts mehr auf Port 9000. Der Container läuft, der Browser meldet nur „Verbindung abgelehnt“ — das sieht aus wie eine fehlgeschlagene Installation. Das Installationsskript setzt das Kennzeichen und gibt zusätzlich Port 9443 frei."
K07 = "<b>Der Setup-Token steht nur im Protokoll.</b> Ab 2.43 beziehungsweise 2.39.4 verlangt die Ersteinrichtung einen Token, der nirgends angezeigt wird und nach fünf Minuten verfällt. Zwei Knöpfe im Reiter <i>Einstellungen</i> holen ihn beziehungsweise starten den Container neu und holen einen frischen."
K08 = "<b>Portainer lässt sich nicht einbetten.</b> Die Oberfläche schickt <span class='sm-mono'>X-Frame-Options</span> und verweigert die Anzeige in einem Rahmen. Deshalb öffnet der Knopf ein eigenes Fenster."
K09 = "Der Endpunkt für Loxone"
K10 = "Er liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist durch ein Merkwort geschützt. Verglichen wird mit <span class='sm-mono'>hash_equals</span>, also in gleichbleibender Zeit."
K11 = "<b>Der Endpunkt ist rein lesend.</b> Er startet und stoppt nichts. Ein Endpunkt im unangemeldeten Bereich, der Container anhalten kann, wäre eine Angriffsfläche ohne Gegenwert — geschaltet wird in Portainer."
K12 = "MQTT, Minutentakt und Herzschlag"
K13 = "Seit 1.3.0 läuft ein Minutentakt (<span class='sm-mono'>cron.01min</span>). Er schreibt den Herzschlag fort, erkennt Neustartschleifen, misst den Plattenplatz und veröffentlicht nach MQTT — das Gateway ist seit LoxBerry 3 Bestandteil des Systems. <b>Seit 1.3.19 ist MQTT der Weg nach Loxone</b> (für neue Anlagen ab Werk an): das Gateway liefert die Werte in Virtuelle Eingänge, deren Namen der Reiter <i>Einbindung in Loxone</i> nennt (mit Kopierknopf); eine aktualisierte Anlage behält ihre Einstellung. Zustände gehen zurückbehalten und nur bei Änderung hinaus (sonst höchstens alle zehn Minuten), das Lebenszeichen in jedem Takt. Seit 1.3.20 prüft die Selbstprüfung im Reiter <i>Test</i> unter MQTT-Gateway V2, ob alle Datenpunkte der Hakenliste im Gateway angehakt sind und „Noncached“ tragen, wo es nötig ist (Fehlendes nennt sie mit Namen)."
K14 = "Der Herzschlag — warum er das Wichtigste ist"
K15 = "Steht der LoxBerry, das MQTT-Gateway oder der Minutentakt, behält ein Virtueller Eingang in Loxone seinen <b>letzten</b> Wert – in der App sieht dann alles normal aus. Dagegen hilft nur ein Wert, der sich ständig ändert: <span class='sm-mono'>status/zaehler</span> zählt bei jedem Minutentakt eins weiter, auch wenn Docker nicht antwortet. Eine Analogwertvalidierung darauf (Baustein-Liste #7) meldet das. Antwortet nur Docker nicht, sagt es <span class='sm-mono'>status/ok</span> = 0 (Baustein-Liste #20 und #38)."
K16 = "Welcher Container gehört zu diesem Plugin?"
K17 = "Seit 1.3.9 erkennt das Plugin seinen Portainer am <b>Label</b> <span class='sm-mono'>de.loxberry.plugin.folder</span>, das die Installation beim Anlegen setzt. Ein Container, der vor 1.3.9 entstand, gilt nur dann als eigener, wenn er <span class='sm-mono'>portainer</span> heißt <b>und</b> aus einem Abbild <span class='sm-mono'>portainer/portainer-*</span> stammt. Jeden anderen Container fasst das Plugin nicht an – weder der Knopf zum Neustart noch die Deinstallation; es sagt nur, was es gefunden hat und warum es ihn stehen lässt. Gibt es schon einen fremden Portainer, legt die Installation keinen zweiten an, und einen angehaltenen startet sie nicht. Das frühere Feld „Name des Portainer-Containers“ ist entfallen."
K18 = "Wenn Docker nicht antwortet – und was über MQTT zurückbleibt"
K19 = "Antwortet Docker nicht (Dienst hängt, <i>permission denied</i>), gehen seit 1.3.19 alle Zähl-, Portainer- und Containerwerte über MQTT auf <b>-1</b> („keine Aussage“), der Text <span class='sm-mono'>stand</span> auf „-“, und <span class='sm-mono'>status/ok</span> sagt 0 – bis 1.3.18 blieben die letzten Werte stehen. Der freie Platz misst ohne Docker; ohne frischen Messwert steht er auf -1. Verschwindet ein Container, der nicht auf der Wachliste steht, räumt das Plugin seine zurückbehaltenen Themen im Broker ab (kurze Sitzung mit Rücklesen) und sendet danach einmal -1. Beim Wechsel des Vorsatzes, beim Abschalten von MQTT, beim Zurückspielen einer Sicherung mit anderem Vorsatz und bei der Deinstallation geschieht dasselbe. Neu ist <span class='sm-mono'>container/&lt;Name&gt;/oom</span>: 1, wenn das System den Container zuletzt wegen Speichermangel beendet hat."
K20 = "Portainer-Abbild aktualisieren"
K21 = "Der Knopf im Reiter <i>Einstellungen</i> holt das Abbild des eigenen Portainer neu (<span class='sm-mono'>docker pull</span>) – im Hintergrund, höchstens 15 Minuten; die Seite zeigt den Stand und lädt sich selbst neu. Hat sich die Kennung des Abbilds geändert, wird nur der eigene Container neu angelegt: derselbe Name, dieselben Ports, derselbe Einrichtungstoken, die Labels; die Daten unter <span class='sm-mono'>/opt/portainer</span> bleiben. Sonst bleibt alles, wie es ist. Den Knopf gibt es nur für einen Container mit dem Label <span class='sm-mono'>de.loxberry.plugin.folder</span>; fremde Container fasst er nicht an. Einen eigenen Altbestand ohne Label (vor 1.3.9 angelegt) stellt der Knopf <i>Portainer neu anlegen (mit Label)</i> einmal um – mit Haken, im Hintergrund, mit denselben Ports, Volumes und Token; danach erscheint der Knopf zum Aktualisieren. Jedes Neuanlegen hält den bisherigen Container erst an und benennt ihn um; entfernt wird er erst, wenn der neue läuft, sonst läuft er wieder wie vorher. Nie von selbst."
K22 = "Welcher Container gehört zu welchem Plugin?"
K23 = "Die Spalte <i>Plugin</i> der Containerübersicht zeigt das Label <span class='sm-mono'>de.loxberry.plugin.folder</span>, das Container-Plugins beim Anlegen setzen (MG iSmart, Sprachsteuerung, Matter to Loxone und Docker NG selbst). Gibt es den Ordner dieses Plugins auf dem LoxBerry nicht mehr, steht über der Tabelle ein Hinweis. Docker NG entfernt solche Container nicht – das entscheidet der Anwender in Portainer."
K24 = "Container aus Loxone neu starten (seit 1.3.19)"
K25 = "Über die gemeinsame Befehlsbrücke nimmt das Plugin <b>einen</b> Befehl an: <span class='sm-mono'>&lt;Vorsatz&gt;/befehl/neustart</span> mit dem Containernamen als Wert. Dafür braucht es zwei Haken im Reiter <i>MQTT</i> (ab Werk aus) und einen Haken in der Spalte <i>Neustart aus Loxone</i> der Containertabelle – nur für Container der ausdrücklichen Wachliste. Nie neu gestartet werden der eigene Portainer, ein Container mit dem Brokerport oder dem UDP-Eingang des Gateways und ein MQTT-Broker; je Container höchstens alle zehn Minuten. Die Quittung (<span class='sm-mono'>…/befehl/neustart/quittung</span>) sagt, was passiert ist. Steuerfreigabe und Neustartliste kommen nie aus einer Sicherung. Der Knopf <i>Neu starten</i> in der Containertabelle startet sofort (mit Rückfrage)."
K26 = "Der HTTP-Endpunkt seit 1.3.19"
K27 = "Der Endpunkt ist der alte Weg und antwortet nur mit dem Haken „HTTP-Endpunkt für Loxone annehmen“ (Reiter <i>Einbindung in Loxone</i>, Abschnitt „Bestehende Anlagen“): nach einem Update an, bei einer Neuinstallation aus. Ohne Haken antwortet er 403 mit <span class='sm-mono'>ERR=ENDPUNKT_AUS</span>, noch vor der Prüfung des Merkworts. Neu in der Statuszeile ist hinten je Container <span class='sm-mono'>O_&lt;Name&gt;</span> (OOM)."
K28 = "<b>Mehrere Lautsprecher gleichzeitig</b> (seit 1.3.20, Sprachmodul 1.2.1): Unter der Ausgabeart (jetzt „Ziel 1“) steht die Tabelle <i>Weitere Ausgabeziele (gleichzeitig)</i> – bis zu 6 Ziele insgesamt, zum Beispiel Loxone Music Server, Google-Lautsprecher (Chromecast 4 Lox NG) und Amazon Echo (Alexa-NG). Jede Ansage geht gleichzeitig an Ziel 1 und an jedes eingeschaltete Ziel der Tabelle; scheitert eines, sprechen die anderen trotzdem, und die Ansage gilt als gesendet, sobald eines gesprochen hat (Protokoll und Reiter Test nennen jedes Ziel). Ist Ziel 1 aus, spricht keines; mit dem Original-Audioserver als Ziel 1 gehen keine weiteren Ziele. Neues Ziel: die leere Zeile ausfüllen und speichern. Mehrere Zonen desselben Music Servers bzw. mehrere Echos gehören in EIN Ziel (Zonenliste, Kommaliste, gruppe:&lt;Name&gt;). Das Sprechtoken steht einmal oben und gilt für alle Ziele dieser Art. Im Reiter Test spricht <i>Testansage</i> an alle Ziele, <i>Testansage an Ziel n</i> nur an dieses. Vor einem Zurückgehen auf eine Fassung vor 1.3.20 die weiteren Ziele entfernen – ältere Fassungen kennen die Liste nicht und fielen beim Laden auf die Werkseinstellung der Sprachausgabe zurück."

CONTAINER_HINWEIS = "Starting, stopping and setting up is done in Portainer. This list is an overview. The plugin itself switches in exactly one place: the button above restarts its <b>own</b> Portainer container – no other one."
H_FEHLT = "These containers are on the watch list but do not exist. Loxone receives <span class='sm-mono'>-1</span> for them. Either they were renamed or removed — then clear their tick in the watch list table below and save — or they really are missing, and that is exactly what should stand out."
H_KOLLISION = "Command recognition allows only letters, digits and underscore; dot and hyphen become underscore. The containers listed above therefore share one key — Loxone takes the first, the second stays unobserved. Remedy: rename one of the two containers."
H_MELDEN = "Produces the red dot on the plugin icon on the LoxBerry start page. Reported only on a <b>change</b> of verdict, not on every run — one message per minute would be noise, not a message. Off by default."
H_PLATZ = "0 turns the warning off. Measured is the free space on the partition holding <span class='sm-mono'>/var/lib/docker</span>. This is the one point that can render a LoxBerry unbootable."
H_PORT = "Default 9000, allowed 1024 to 65535, different from the HTTPS port. <b>A change only takes effect once the container is recreated</b> – during installation if none exists yet, or with the <i>Recreate Portainer</i> button above. If the port is taken during installation, it moves to the next free one (at most 20 further), enters it here and says so in the installation log. From Portainer CE 2.19 onwards only a container created with <span class='sm-mono'>--http-enabled</span> listens on this port – this plugin does that."
H_SCHLEIFE = "Docker counts restarts over a container's whole lifetime — 47 in two years is healthy, five in ten minutes is not. What is counted is therefore the increase within a sliding one-hour window. A manual restart — for example via the <i>… restart and fetch token</i> button — does <b>not</b> increment this counter (measured on a device: two restarts, the counter stayed 0). Only restarts that Docker triggers itself are counted. The default of 3 lets a single crash with recovery pass and reports only an accumulation."
H_SICHERUNG = "Back up and restore settings"
H_TOKENNEU = "<b>Careful:</b> the token is part of the addresses in the Miniserver. After generating a new one, every virtual input in Loxone Config has to be adjusted."
H_UPDATES = "<b>This goes out to the network.</b> Checksums are compared via a HEAD request to the registry; HEAD does not count towards the Docker Hub pull limit. Where no answer arrives — private registry, locally built image — that means <i>unknown</i>, not <i>outdated</i>. Nothing is downloaded and nothing is updated. Off by default."
H_WACHE = "Without this tick the selection in the table above applies. The difference matters: with „all“ every newly created container goes to Loxone automatically — but the import file must then be regenerated after every new container. With a fixed selection the import file stays stable, and a container that no longer exists reports <span class='sm-mono'>-1</span> instead of simply vanishing."
KEINE_CONTAINER = "No container has been set up yet. Create the first one in Portainer via <i>Add container</i>."
KEIN_IFRAME = "<b>Portainer cannot be embedded in this page.</b> Its interface sends <span class='sm-mono'>X-Frame-Options</span> and thereby forbids display inside a frame — a protection against a foreign page slipping clicks to Portainer. That is why the button above opens a separate window."

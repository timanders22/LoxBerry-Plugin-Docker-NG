[LOX]
TITEL = "Report container status to Loxone"
EINLEITUNG = "This lets Loxone display or report when a container stops running — the gateway delivering car or weather data, for example. Otherwise it only becomes apparent once the values are days old. It also reports a container that runs but fails its own health check, one that keeps restarting, one the system killed for lack of memory, or one that is gone entirely. <b>Since 1.3.19 the values come through the MQTT gateway into virtual inputs</b> (step 1); a released container can be restarted from Loxone (step 2). The HTTP endpoint is the old path for existing installations (below, collapsed)."
S1 = "Step 1: Create a virtual HTTP input"
S1_TEXT = "In Loxone Config create a virtual HTTP input with this address:"
S1_HINWEIS = "A polling interval of 60 seconds is enough. The answer is a single line:"
S2 = "Step 2: Command recognitions"
T_TITEL = "Name"
T_ERKENNUNG = "Command recognition"
T_BEDEUTUNG = "Meaning"
F_OK = "1 = Docker responds"
F_GESAMT = "containers set up"
F_LAEUFT = "of these active"
F_GESTOPPT = "all not running - do not alert"
F_CONTAINER = "1 = container %s is running"
S2_HINWEIS = "Each detected container additionally gets its own field in the same line. A single container can therefore be monitored without a second query."
S3 = "Step 3: Generate the import file"
S3_TEXT = "Instead of creating every input by hand, the button generates a ready-made import file for Loxone Config — with title, comment and limits already in place."
B_XML = "Generate import file for Loxone Config"
S3_WARNUNG = "<b>Loxone Config creates new objects on import and overwrites nothing.</b> Importing twice means duplicate objects. The address in the file header is a suggestion — please check that the Miniserver reaches the LoxBerry under that name."
S4 = "Step 3: Complete block list to rebuild"
S4_TEXT = "The page “Docker NG” from the LoxBerry plugins sample project, every row one block (block search in Loxone Config: key <b>F5</b>). It reports failed, missing, unhealthy and constantly restarting containers, low disk space, a single watched container, a Docker that does not answer and a silent LoxBerry, shows everything in three status blocks and restarts a container by button. The inputs are virtual inputs named as in step 1 (column Name)."
B_TYP = "Block (type)"
B_NAME = "Name (suggestion)"
B_PARAM = "Parameters"
B_EIN = "Connect inputs to"
S4_ZU3 = "<b>On #9, #24, #28 and #33:</b> every report runs through an on-delay of 300 s, well above the minute task of the plugin. A short glitch should not trigger a report."
S4_ZU4 = "<b>On #5 and #8:</b> never connect several sources directly to a notification block – it gets exactly one connection, an OR at most two inputs. The OR only bundles: the block only sends on the change from off to on, and a permanently active fault still swallows every further report on the same notification. That is why “krank”, “Speicher knapp” and the single watched container have their own notifications."
S5 = "Step 4: Failure detection"
S5_TEXT = "If the LoxBerry, the MQTT gateway or the minute task stands still, the virtual inputs keep their <b>last</b> value — everything would look normal in the app. Only a value that keeps changing helps against that: <span class='sm-mono'>status/zaehler</span> advances by one on every minute task, even when Docker does not answer. The analog value validation on it (#6, #7) reports when nothing new arrives for five minutes. If only Docker does not answer, <span class='sm-mono'>status/ok</span> = 0 reports it (#20 via #38 and #43); the counts and container values then stand at -1 (no statement)."
S6 = "Step 5: Cross-check"
S6_TEXT = "On the <b>MQTT</b> tab, the <i>topic list</i> shows what is being sent right now; on the <b>Test</b> tab the MQTT row shows the last dispatch. Check in Loxone Config, in the monitor of the virtual inputs, that the values arrive – the heartbeat rises every minute."
XML_KOMMENTAR = "Docker NG - container status"
F_AUSFALL = "alert when greater than 0"
F_PAUSIERT = "paused containers"
F_PORTAINER = "1 = own Portainer running"
S2_AUSFALL = "<b>For monitoring, <span class='sm-mono'>AUSFALL</span> is the right value, not <span class='sm-mono'>GESTOPPT</span>.</b> Stopped also counts containers that finished as planned — on a grown LoxBerry that value is never 0, and a collective fault that is permanently active swallows every other message. Stopped is kept so existing programs continue to work."
F_UNGESUND = "containers failing healthcheck"
F_FEHLT = "watched containers that do not exist"
F_SCHLEIFE = "restart loops, -1 = task stalled"
F_ZAEHLER = "heartbeat, -1 = minute task stalled"
F_PLATZFREI = "free space in MB, -1 unknown"
F_TAKTALTER = "age of the minute task, -1 = never"
F_CONTAINER_KURZ = "1 running, 0 stopped, -1 missing"
F_GESUND_KURZ = "-1 gone,0 none,1 starting,2 ok,3 bad"
S4_ZU7 = "<b>On #7:</b> the analog value validation is connected to the sign of life status/zaehler (#6). If the LoxBerry, the MQTT gateway or the minute task stands still, or MQTT is off in the plugin, no new value arrives, and #7 sets its output error after Tmc (300 s). If only Docker does not answer, the counter keeps running – #38 reports that. Loxone Config labels the connectors V, En, Tmc, Min, Max and the output E (in the project file inval, mintime, minval, maxval, error). Connect the counter to V, not to En; connect a constant 1 to En – unconnected, En is ON (tick set); if En is connected, remove the tick. Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
S4_EINZELN = "<b>On #30 to #34, #37, #39 and #40:</b> a single watched container gets a notification of its own – do not loop it in between #8 and #9. Report a further container the same way: repeat the rows with its names from the name table (step 1: <span class='sm-mono'>…_container_&lt;Name&gt;_laeuft</span>, <span class='sm-mono'>_gesund</span>, <span class='sm-mono'>_oom</span>); under gateway V2 tick the three data points. A container that finishes as planned (a nightly backup, for example) reports “steht” here every night: do not report such containers individually."
S4_ZU11 = "<b>On #11:</b> The analog value validation gets the constant 1 at En."

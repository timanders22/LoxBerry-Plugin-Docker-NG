H_PORT = "Default is 9000. <b>This field does not reconfigure the container</b> — it is the fallback for the display in case the real port cannot be read from the container. To run Portainer on a different port, recreate the container with the mapping you want, e.g. <span class='sm-mono'>-p 9001:9000</span>. From Portainer CE 2.19 onwards nothing listens on port 9000 without <span class='sm-mono'>--http-enabled</span> — the container runs, but the browser only reports <i>connection refused</i>. This plugin's installation script sets the flag."
H_SCHLEIFE = "Docker counts restarts over a container's whole lifetime — 47 in two years is healthy, five in ten minutes is not. What is counted is therefore the increase within a sliding one-hour window. <b>Not measured:</b> whether a manual restart — for example via the button in the Test tab — also increments this counter. That is why the default is 3 and not 1."

Z42_NAME = "Docker NG: Container neu starten"
Z43_NAME = "Docker schweigt oder antwortet nicht"
Z43_PARAM = "— (no sign of life or Docker does not answer)"
Z42_PARAM = "command on ON: publish %2$s/befehl/neustart mein_container (never retain); replace “mein_container” with the name of your own container; intervening – only works with the ticks “Accept commands via MQTT” and “Allow container restart from Loxone” (MQTT tab) and if the container is on the watch list of the plugin and ticked in the column “Restart from Loxone”; never the plugin's own Portainer, never an MQTT broker; at most every 10 minutes per container; the answer is on %2$s/befehl/neustart/quittung"
H_ZU38 = "<b>On #38 and #39:</b> #38 turns status/ok = 0 (“Docker does not answer”) into a fault; the OR #43 bundles it with the output error of #7 for the collective fault #8 (an OR has exactly two inputs). Formula #39 keeps #32 from reporting “portainer steht” at -1 (“no statement”, because Docker is silent) – #38 already reports that. If the container is really missing (-1 while Docker answers), #32 still reports."
H_ZU42 = "<b>On #41 and #42:</b> the restart only happens by button in the app – deliberately no automatic restart on “stopped longer”: such logic can escalate with a broken container or a broker container. “mein_container” is a placeholder; by default the plugin rejects it (“not released”). The plugin's own Portainer can never be restarted from Loxone, an MQTT broker neither."

S4_ZU3 = "<b>On #9:</b> the delay is well above the polling interval of 60 seconds. A single missed cycle should not trigger a report."
S4_ZU4 = "<b>On #5 and #8:</b> never connect several sources directly to the notification block. It only fires on the transition from off to on — a permanently active source would otherwise swallow all the others. Merge them through OR first, at most two inputs per OR."
S5 = "Step 5: Failure detection"
S5_TEXT = "If the LoxBerry does not answer at all, the virtual input keeps its <b>last</b> value — everything then looks normal in the app. The same holds when Docker does not answer: the endpoint then returns HTTP 503 and no values, and Loxone keeps all previous ones as well, including <span class='sm-mono'>DOCKERNG_OK=1</span>. Only a value that keeps changing helps against that: <span class='sm-mono'>DOCKERNG_ZAEHLER</span> advances by one on every run of the minute task and turns to -1 once the task is older than three minutes. The change monitor on it (#6 and #7) reports both, even when every other value looks fine."
S6 = "Step 6: Cross-check"
S6_TEXT = "In the <b>Test</b> tab, under <i>View</i>, press <i>Fetch the Loxone line</i>. If the same line appears as above, address and token are correct. Then check in Loxone Config, in the monitor of the virtual input, that the values arrive."

WAS_IST_DAS = "<b>Docker and Portainer on the LoxBerry, with status reports to Loxone.</b> The plugin installs Docker and Portainer, the interface that lets you click containers instead of typing commands. A minute task asks Docker for the state of every container: running, stopped, fault, health check, restart loop, plus the free disk space. The state reaches the Miniserver through a read-only, token-protected HTTP endpoint and, on request, over MQTT; a fault is also reported in the LoxBerry notification centre, and on request as an announcement."

[LOX]
TITEL = "Report container status to Loxone"
EINLEITUNG = "This lets Loxone display or report when a container stops running — the gateway delivering car or weather data, for example. Otherwise it only becomes apparent once the values are days old. It also reports a container that runs but fails its own health check, one that keeps restarting, or one that is gone entirely."

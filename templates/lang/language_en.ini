Z39_PARAM = "IF(I2<1;1;I1) – if Docker does not answer (I2 = 0), it counts as “running”; Docker itself is reported by the collective fault (#38)"
Z40_PARAM = "1 = %1$s was last killed by the system for lack of memory (OOM), 0 = no, -1 = missing or no statement; retained; version 2: tick"

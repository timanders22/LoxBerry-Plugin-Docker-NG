F_PAUSIERT = "paused containers"
F_PORTAINER = "1 = own Portainer running"
S2_AUSFALL = "<b>For monitoring, <span class='sm-mono'>AUSFALL</span> is the right value, not <span class='sm-mono'>GESTOPPT</span>.</b> Stopped also counts containers that finished as planned — on a grown LoxBerry that value is never 0, and a collective fault that is permanently active swallows every other message. Stopped is kept so existing programs continue to work."

S4_ZU4 = "<b>On #4:</b> never connect several sources directly to the notification block. It only fires on the transition from off to on &mdash; a permanently active source would otherwise swallow all the others. Merge them through OR first."
S5 = "Step 5: Failure detection"
S5_TEXT = "If the LoxBerry does not answer at all, the virtual input keeps its <b>last</b> value &mdash; in the app everything then looks normal. That is why the <i>NOT</i> block goes behind <span class='sm-mono'>DOCKERNG_OK</span> (#6 and #7), plus a report when the value stops changing for a while."

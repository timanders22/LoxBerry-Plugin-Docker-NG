SCHRITT1 = "In the plugin, tab “%s”: tick the containers to be watched in the container table and press “%s” (no tick: all containers). Tab “%s”: tick “%s” (on by default) – the Test tab then shows the last MQTT dispatch."
SCHRITT2 = "MQTT gateway: under version 1 the subscription %s/# is already in the plugin's subscription file; under version 2 tick the data points from the MQTT tab (V2 tick list) in the Subscriptions, for status/ok additionally “Noncached”. On Miniserver start send “reconnect” to the gateway (page “LoxBerry MQTT-Gateway” in the sample project)."
SCHRITT3 = "Create the page “Docker NG”. For every row “Virtual input” create a virtual input (Periphery → Virtual Inputs → Virtual Input): title = name from the list (above in step 1 with copy button), do NOT tick “Use as digital input”, switch on “Statistics” for %s and %s; in addition the constant 1. The LoxBerry user needs permissions on each of these inputs in Loxone."
SCHRITT4 = "Create four notifications (Periphery → Messages → Notification): “Docker-Störung”, “Docker Container krank”, “Docker Speicher knapp”, “%s”, texts as in the list, and drag them onto the page. Each gets exactly one connection. For #42 create a command on the existing output “LoxBerry MQTT-Gateway” (address /dev/udp/<LoxBerry>/<UDP port>), command on ON as in the list, and replace mein_container with your own container name."
SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them from top to bottom according to the column “%s”. Status inputs from V3 or V5 only appear after clicking the “+” on the block: “Docker Container” four times (V5–V8), “Docker LoxBerry” once (V5), “Container …” twice (V3–V4). An OR has exactly two inputs – that is why #43 bundles the failure detection #7 and #38 for #8. The rows of the status blocks are in the column “%s” and are entered by hand – in the given order, the row without condition last."
SCHRITT6 = "Save and transfer to the Miniserver. Test: “Docker LoxBerry” shows “OK – … MB free, heartbeat …”, the heartbeat rises by one every minute; “Docker Container” shows the same number of running containers as the status overview above the tabs of the plugin."
H_ZU26 = "<b>On #26 and #27:</b> the formula turns “unknown” (-1, not measured yet) into a large value so that “Speicher knapp” does not trigger. The space is only measured every 15 minutes. 512 MB is the warning threshold of the plugin (Settings tab); whoever changes it there changes #27 and the row in status #36 as well."
H_OK = "<b>On #20:</b> status/ok arrives every minute with the sign of life and is almost always 1. Under gateway V2 tick “Noncached” – otherwise the input would stay at 0 after a Miniserver restart, and #38 would wrongly report “Docker does not answer”. The on-delay #9 (300 s) bridges the Miniserver start."
H_DOPPELT = "Whoever switches on “Report faults to the LoxBerry notification centre” or the voice output in the plugin gets the same findings additionally on the LoxBerry or as an announcement – deselect one of them if you only want the Loxone app."
H_GRENZEN = "Not on the page: <span class='sm-mono'>status/ts</span> (Unix seconds – Loxone counts in local time), <span class='sm-mono'>platte/images_mb</span>, <span class='sm-mono'>platte/freigebbar_mb</span> and the state per container as text (<span class='sm-mono'>container/&lt;Name&gt;/stand</span>; to show it, use a virtual text input). The acknowledgement of the restart (<span class='sm-mono'>befehl/neustart/quittung</span>) is meant for the log, not for Loxone."

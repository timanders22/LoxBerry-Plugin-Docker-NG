; Docker NG - language file English
;
; English is the fallback layer, not German: readlanguage reads the foreign
; language first, then English, and does not overwrite existing keys. Missing
; German keys therefore appear in English, not empty.
;
; Every value is in double quotes: with parse_ini_file a semicolon starts a
; comment, so an unquoted value would be cut off there - which would hit every
; HTML entity, since ü, — and → all end in a semicolon.
;
; No double quote may appear inside a value. Quote HTML attributes with single
; quotes instead: <span class='sm-mono'>.

[ALLGEMEIN]
TITEL = "Docker NG"
EINLEITUNG = "Docker runs additional programs in self-contained containers on the LoxBerry — each with everything it needs, without getting in the way of the rest of the system. <b>Portainer</b> is the user interface for it: containers can be clicked instead of typed on the command line."
JA = "yes"
NEIN = "no"
LAEUFT = "running"
GESTOPPT = "stopped"
SPEICHERN = "Save"


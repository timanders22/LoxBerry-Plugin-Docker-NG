S4_ZU7 = "<b>On #7:</b> if Docker does not answer (including <i>permission denied</i>), the endpoint returns HTTP 503 without values; the counter then stands still, and that is exactly what #7 reports after five minutes – likewise when the LoxBerry does not answer at all or the minute task stops (then -1)."
S4_EINZELN = "To report a single container on its own: <span class='sm-mono'>DOCKERNG_C_&lt;name&gt;</span> as a virtual input, followed by a threshold switch <i>on from 1, off below 1</i> and a NOT block (reports on 0 = stopped and -1 = missing), and loop its output in through another OR with two inputs between #8 and #9."


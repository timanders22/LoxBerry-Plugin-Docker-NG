ROTATION_NEIN = "<b>Container logs grow without limit.</b> The <span class='sm-mono'>json-file</span> driver defaults to <span class='sm-mono'>max-size: -1</span>. A single talkative container in a reconnect loop will fill the memory card — and a full file system makes the LoxBerry unbootable. Remedy on the command line: in <span class='sm-mono'>/etc/docker/daemon.json</span> set <span class='sm-mono'>max-size</span> and <span class='sm-mono'>max-file</span> under <span class='sm-mono'>log-opts</span>, then <span class='sm-mono'>sudo systemctl restart docker</span>. <b>Note:</b> this only affects containers created afterwards; existing ones keep their old options."

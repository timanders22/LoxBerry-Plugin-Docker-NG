; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Docker NG"
K02 = "Docker runs additional programs in self-contained containers on the LoxBerry. <b>Portainer</b> is the user interface for it."
K03 = "Relationship to the „Docker“ plugin"
K04 = "Docker NG is a <b>plugin in its own right</b>, not an update of the older Docker plugin by M. Miklis. It uses its own folder (<span class='sm-mono'>dockerng</span>) and its own identifier — the two can be installed side by side, and anyone who prefers the original keeps it unchanged. The original author has stated that he no longer runs either Docker or a LoxBerry."
K05 = "The three pitfalls with Portainer"
K06 = "<b>Port 9000 stayed silent.</b> From Portainer CE 2.19 onwards, nothing listens on port 9000 without <span class='sm-mono'>--http-enabled</span>. The container runs, the browser only says „connection refused“ — which looks like a failed installation. The installation script sets the flag and additionally exposes port 9443."
K07 = "<b>The setup token appears only in the log.</b> From 2.43 (2.39.4 respectively) the initial setup demands a token that is displayed nowhere and expires after five minutes. Two buttons on the <i>Settings</i> tab fetch it, or restart the container and fetch a fresh one."
K08 = "<b>Portainer cannot be embedded.</b> Its interface sends <span class='sm-mono'>X-Frame-Options</span> and refuses to be displayed in a frame. That is why the button opens a separate window."
K09 = "The endpoint for Loxone"
K10 = "It sits in the unauthenticated area so that Loxone can reach it without credentials, and it is protected by a secret word. Comparison uses <span class='sm-mono'>hash_equals</span>, that is, in constant time."
K11 = "<b>The endpoint is read-only.</b> It starts and stops nothing. An endpoint in the unauthenticated area that could halt containers would be an attack surface without any benefit — switching happens in Portainer."
K12 = "MQTT, minute task and heartbeat"
K13 = "Since 1.3.0 a minute task runs (<span class='sm-mono'>cron.01min</span>). It advances the heartbeat, detects restart loops, measures disk space and, on request, publishes over MQTT — the gateway has been part of the system since LoxBerry 3. MQTT does <b>not</b> replace the HTTP endpoint, it stands beside it. All new functions are off by default. Since 1.3.9 the task sends states retained and only on change (otherwise at most every ten minutes), the sign of life on every run, with a short pause between messages."
K14 = "The heartbeat — why it matters most"
K15 = "If the LoxBerry does not answer at all, a virtual input in Loxone keeps its <b>last</b> value. The same happens when Docker does not answer: the endpoint then returns HTTP 503 without values, and Loxone keeps all previous ones, including <span class='sm-mono'>DOCKERNG_OK=1</span>. Everything then looks normal in the app. Only a value that keeps changing helps: <span class='sm-mono'>DOCKERNG_ZAEHLER</span> advances by one on every run and turns to -1 when the minute task stops. A change monitor on it reports both, even when every other value looks fine."
K16 = "Which container belongs to this plugin?"
K17 = "Since 1.3.9 the plugin recognises its Portainer by the <b>label</b> <span class='sm-mono'>de.loxberry.plugin.folder</span>, which the installation sets when creating it. A container created before 1.3.9 only counts as its own if it is named <span class='sm-mono'>portainer</span> <b>and</b> comes from an image <span class='sm-mono'>portainer/portainer-*</span>. The plugin does not touch any other container – neither the restart button nor the uninstallation; it only says what it found and why it leaves it alone. If a foreign Portainer already exists, the installation does not create a second one, and it does not start a stopped one. The former field “Name of the Portainer container” is gone."
K18 = "When Docker does not answer – and what stays behind over MQTT"
K19 = "If Docker does not answer (service hanging, <i>permission denied</i>), the endpoint returns <b>HTTP 503</b> and no values – never a -1 for containers that could not be asked at all. Every docker call has a time limit. Values from the minute task (heartbeat, restart loops, free space) are only passed on while the task is at most three minutes old; otherwise they are -1, and <span class='sm-mono'>TAKTALTER</span> gives the age in seconds. Over MQTT the container states go out retained, the sign of life never; if Docker is silent, the states stay and only <span class='sm-mono'>status/ok 0</span> goes out. If a container that is not on the watch list disappears, its topics get <span class='sm-mono'>-</span> once. When the prefix changes, MQTT is switched off or the plugin is uninstalled, the retained topics are cleared."
K20 = "Updating the Portainer image"
K21 = "The button in the <i>Settings</i> tab pulls the image of the own Portainer again (<span class='sm-mono'>docker pull</span>) – in the background, at most 15 minutes; the page shows the progress and reloads itself. If the ID of the image has changed, only the own container is created anew: same name, same ports, same setup token, the labels; the data under <span class='sm-mono'>/opt/portainer</span> stay. Otherwise everything stays as it is. The button only exists for a container with the label <span class='sm-mono'>de.loxberry.plugin.folder</span>; it does not touch foreign containers. An own old container without a label (created before 1.3.9) is converted once by the button <i>Recreate Portainer (with label)</i> – with a tick, in the background, with the same ports, volumes and token; after that the update button appears. Every recreation first stops and renames the previous container; it is removed only once the new one runs, otherwise it runs again as before. Never by itself."
K22 = "Which container belongs to which plugin?"
K23 = "The column <i>Plugin</i> of the container overview shows the label <span class='sm-mono'>de.loxberry.plugin.folder</span> that container plugins set when they create a container (MG iSmart, Sprachsteuerung, Matter to Loxone and Docker NG itself). If the folder of that plugin no longer exists on the LoxBerry, a note appears above the table. Docker NG does not remove such containers – the user decides that in Portainer."

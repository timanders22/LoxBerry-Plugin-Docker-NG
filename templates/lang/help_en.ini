; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Docker NG"
K02 = "Docker runs additional programs in self-contained containers on the LoxBerry. <b>Portainer</b> is the user interface for it."
K03 = "Relationship to the „Docker“ plugin"
K04 = "Docker NG is a <b>plugin in its own right</b>, not an update of the older Docker plugin by M. Miklis. It uses its own folder (<span class='sm-mono'>dockerng</span>) and its own identifier — the two can be installed side by side, and anyone who prefers the original keeps it unchanged. The original author has stated that he no longer runs either Docker or a LoxBerry."
K05 = "The three pitfalls with Portainer"
K06 = "<b>Port 9000 stayed silent.</b> From Portainer CE 2.19 onwards, nothing listens on port 9000 without <span class='sm-mono'>--http-enabled</span>. The container runs, the browser only says „connection refused“ — which looks like a failed installation. The installation script sets the flag and additionally exposes port 9443."
K07 = "<b>The setup token appears only in the log.</b> From 2.43 (2.39.4 respectively) the initial setup demands a token that is displayed nowhere and expires after five minutes. Two buttons on the <i>Settings</i> tab fetch it, or restart the container and fetch a fresh one."
K08 = "<b>Portainer cannot be embedded.</b> Its interface sends <span class='sm-mono'>X-Frame-Options</span> and refuses to be displayed in a frame. That is why the button opens a separate window."
K09 = "The endpoint for Loxone"
K10 = "It sits in the unauthenticated area so that Loxone can reach it without credentials, and it is protected by a secret word. Comparison uses <span class='sm-mono'>hash_equals</span>, that is, in constant time."
K11 = "<b>The endpoint is read-only.</b> It starts and stops nothing. An endpoint in the unauthenticated area that could halt containers would be an attack surface without any benefit — switching happens in Portainer."
K12 = "MQTT, minute task and heartbeat"
K13 = "Since 1.3.0 a minute task runs (<span class='sm-mono'>cron.01min</span>). It updates the heartbeat, detects restart loops, measures disk space and publishes via MQTT — the gateway has been part of the system since LoxBerry 3. <b>Since 1.3.19 MQTT is the path to Loxone</b> (on by default for new installations): the gateway delivers the values into virtual inputs whose names the tab <i>Integration into Loxone</i> lists (with a copy button); an updated installation keeps its setting. States go out retained and only on change (otherwise at most every ten minutes), the sign of life on every cycle. Since 1.3.20 the self-check in the <i>Test</i> tab verifies under MQTT gateway V2 that all data points of the tick list are ticked in the gateway and carry “Noncached” where needed (anything missing is named)."
K14 = "The heartbeat — why it matters most"
K15 = "If the LoxBerry, the MQTT gateway or the minute task stands still, a virtual input in Loxone keeps its <b>last</b> value – everything then looks normal in the app. Only a value that keeps changing helps against that: <span class='sm-mono'>status/zaehler</span> advances by one on every minute task, even when Docker does not answer. An analog value validation on it (block list #7) reports that. If only Docker does not answer, <span class='sm-mono'>status/ok</span> = 0 says so (block list #20 and #38)."
K16 = "Which container belongs to this plugin?"
K17 = "Since 1.3.9 the plugin recognises its Portainer by the <b>label</b> <span class='sm-mono'>de.loxberry.plugin.folder</span>, which the installation sets when creating it. A container created before 1.3.9 only counts as its own if it is named <span class='sm-mono'>portainer</span> <b>and</b> comes from an image <span class='sm-mono'>portainer/portainer-*</span>. The plugin does not touch any other container – neither the restart button nor the uninstallation; it only says what it found and why it leaves it alone. If a foreign Portainer already exists, the installation does not create a second one, and it does not start a stopped one. The former field “Name of the Portainer container” is gone."
K18 = "When Docker does not answer – and what stays behind over MQTT"
K19 = "If Docker does not answer (service hangs, <i>permission denied</i>), since 1.3.19 all counts, Portainer and container values go to <b>-1</b> over MQTT (“no statement”), the text <span class='sm-mono'>stand</span> to “-”, and <span class='sm-mono'>status/ok</span> says 0 – up to 1.3.18 the last values stayed. The free space is measured without Docker; without a fresh measurement it is -1. If a container that is not on the watch list disappears, the plugin clears its retained topics in the broker (short session with read-back) and then sends -1 once. The same happens when the prefix changes, when MQTT is switched off, when a backup with another prefix is restored and on uninstall. New is <span class='sm-mono'>container/&lt;Name&gt;/oom</span>: 1 if the system last killed the container for lack of memory."
K20 = "Updating the Portainer image"
K21 = "The button in the <i>Settings</i> tab pulls the image of the own Portainer again (<span class='sm-mono'>docker pull</span>) – in the background, at most 15 minutes; the page shows the progress and reloads itself. If the ID of the image has changed, only the own container is created anew: same name, same ports, same setup token, the labels; the data under <span class='sm-mono'>/opt/portainer</span> stay. Otherwise everything stays as it is. The button only exists for a container with the label <span class='sm-mono'>de.loxberry.plugin.folder</span>; it does not touch foreign containers. An own old container without a label (created before 1.3.9) is converted once by the button <i>Recreate Portainer (with label)</i> – with a tick, in the background, with the same ports, volumes and token; after that the update button appears. Every recreation first stops and renames the previous container; it is removed only once the new one runs, otherwise it runs again as before. Never by itself."
K22 = "Which container belongs to which plugin?"
K23 = "The column <i>Plugin</i> of the container overview shows the label <span class='sm-mono'>de.loxberry.plugin.folder</span> that container plugins set when they create a container (MG iSmart, Sprachsteuerung, Matter to Loxone and Docker NG itself). If the folder of that plugin no longer exists on the LoxBerry, a note appears above the table. Docker NG does not remove such containers – the user decides that in Portainer."
K24 = "Restart containers from Loxone (since 1.3.19)"
K25 = "Through the shared command bridge the plugin accepts <b>one</b> command: <span class='sm-mono'>&lt;prefix&gt;/befehl/neustart</span> with the container name as value. It needs two ticks on the <i>MQTT</i> tab (off by default) and a tick in the column <i>Restart from Loxone</i> of the container table – only for containers of the explicit watch list. Never restarted are the plugin's own Portainer, a container with the broker port or the gateway's UDP input, and an MQTT broker; per container at most every ten minutes. The acknowledgement (<span class='sm-mono'>…/befehl/neustart/quittung</span>) says what happened. Control release and restart list never come from a backup. The button <i>Restart</i> in the container table restarts immediately (with confirmation)."
K26 = "The HTTP endpoint since 1.3.19"
K27 = "The endpoint is the old path and only answers with the tick “Accept the HTTP endpoint for Loxone” (tab <i>Integration into Loxone</i>, section “Existing installations”): on after an update, off for a new installation. Without the tick it answers 403 with <span class='sm-mono'>ERR=ENDPUNKT_AUS</span>, even before the token is checked. New at the end of the status line is <span class='sm-mono'>O_&lt;Name&gt;</span> (OOM) per container."
K28 = "<b>Several speakers at once</b> (since 1.3.20, speech module 1.2.1): below the output type (now “target 1”) the table <i>Further outputs (simultaneous)</i> takes up to 6 targets in total, for example Loxone Music Server, Google speakers (Chromecast 4 Lox NG) and Amazon Echo (Alexa-NG). Every announcement goes to target 1 and to every enabled target of the table at the same time; if one fails the others still speak, and the announcement counts as sent as soon as one has spoken (the log and the Test tab name every target). If target 1 is off, none speaks; the original Audio Server as target 1 cannot be combined with further targets. New target: fill in the empty row and save. Several zones of the same Music Server or several Echos belong in ONE target (zone list, comma list, gruppe:&lt;name&gt;). The speech token is entered once above and applies to all targets of that kind. In the Test tab <i>Test announcement</i> speaks to all targets, <i>Test announcement to target n</i> only to that one. Before going back to a version older than 1.3.20 remove the further targets – older versions do not know the list and would fall back to the factory settings of the speech output."
